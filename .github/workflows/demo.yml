name: Warehouse demo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check PHP syntax
        run: docker compose exec -T web sh -c 'find app public -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Check the four demonstration accounts
        run: python3 tests/demo_accounts.py
