services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse-local-demo}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - warehouse-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: warehouse
      DB_USER: warehouse
      DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse-local-demo}
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  warehouse-data:
