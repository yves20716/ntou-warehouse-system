<VirtualHost *:80>
    DocumentRoot /srv/warehouse/public
    <Directory /srv/warehouse/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /srv/warehouse/public/partials>
        Require all denied
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
